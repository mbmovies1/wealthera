<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Container -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4b37" />
      <stop offset="50%" stop-color="#09392a" />
      <stop offset="100%" stop-color="#042319" />
    </linearGradient>

    <!-- Emerald Glow inside Icon -->
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#157152" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#042319" stop-opacity="0" />
    </radialGradient>

    <!-- Mint to Yellow to Orange Arrow Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Arrow Head Gradient -->
    <linearGradient id="arrowHeadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- White Stem 3D Lighting -->
    <linearGradient id="stemLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="stemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Square App Icon Box -->
  <rect x="50" y="45" width="400" height="400" rx="95" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="50" y="45" width="400" height="400" rx="95" fill="url(#innerGlow)" />
  <rect x="50" y="45" width="400" height="400" rx="95" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />

  <!-- 3D Stylized White Letter "W" -->
  <g id="letterW">
    <!-- Left Wing -->
    <path d="M 98 135 L 148 135 C 158 135 166 142 168 152 L 202 290 L 158 290 C 146 290 137 282 134 270 L 98 135 Z" fill="url(#stemLeft)" opacity="0.95" />

    <!-- Left Main Diagonal -->
    <path d="M 148 135 L 195 135 C 205 135 212 143 216 153 L 260 295 C 265 310 255 325 240 325 C 230 325 222 318 218 308 L 148 135 Z" fill="url(#stemRight)" />

    <!-- Center Apex & Right Main Stem -->
    <path d="M 235 135 L 290 135 C 298 135 306 141 309 150 L 372 315 C 378 330 367 348 350 348 C 340 348 331 341 327 330 L 265 180 L 245 235 C 240 248 222 245 220 230 L 235 135 Z" fill="url(#stemLeft)" />

    <!-- Right Wing of W -->
    <path d="M 330 145 L 378 145 C 388 145 395 153 392 163 L 340 340 C 336 352 320 354 312 342 L 285 295 L 330 145 Z" fill="url(#stemRight)" opacity="0.9" />
  </g>

  <!-- Sweeping Arrow: Mint Green -> Golden Yellow -> Vibrant Orange -->
  <g id="growthArrow" filter="url(#arrowShadow)">
    <!-- Lower Mint Crescent Swoosh -->
    <path d="M 95 240 C 90 285 110 325 150 340 C 190 355 240 345 290 310 C 335 278 375 225 395 165 C 385 190 345 255 285 285 C 235 310 180 315 140 295 C 108 280 98 255 95 240 Z" fill="url(#swooshGrad)" />

    <!-- Bold Main Ribbon crossing across the W -->
    <path d="M 105 260 C 120 310 170 335 230 315 C 290 295 345 245 395 150 L 375 145 C 330 230 280 275 225 295 C 175 312 135 292 120 255 Z" fill="#f97316" opacity="0.9" />

    <!-- Upward Dynamic Arrow Head pointing to top-right (wealth growth) -->
    <polygon points="415,115 365,130 380,155 350,175 375,200 405,170 420,185" fill="url(#arrowHeadGrad)" />
  </g>
</svg>